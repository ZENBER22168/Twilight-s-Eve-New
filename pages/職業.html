<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>✨ 職業技能</title><link rel="icon" href="../images/site-icon.png">
<link rel="stylesheet" href="../style.css"><style>
.skill-selector{padding:18px 20px;margin-bottom:28px}.skill-selector label{font-size:20px}.skill-selector select{font-size:19px;min-width:340px;padding:14px 18px}
.skill-character{padding:24px}.skill-character-head{gap:18px;padding-bottom:20px;margin-bottom:20px}.character-portrait{width:118px;height:118px}.skill-character-head h2{font-size:30px}
.skill-list{grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:18px}.skill-card{grid-template-columns:92px 1fr;gap:18px;padding:18px}.skill-icon{width:80px;height:80px}.skill-title{font-size:23px}.skill-key{min-width:42px;height:42px;font-size:17px}.skill-meta{font-size:16px;gap:10px}.skill-desc{font-size:19px;line-height:1.75}
@media(max-width:760px){.skill-list{grid-template-columns:1fr}.skill-card{grid-template-columns:74px 1fr}.skill-icon{width:64px;height:64px}.character-portrait{width:96px;height:96px}.skill-selector select{min-width:0;width:100%}}
</style></head><body><header class="top"><nav class="nav"><a class="brand" href="../index.html" aria-label="新暮光之晨 首頁"><img class="brand-logo" src="../images/site-icon.png" alt="新暮光之晨 icon"><span class="brand-title"><span class="brand-name">新暮光之晨</span><span class="brand-version">v2.74</span></span></a><a href="../index.html">🏠 首頁</a><a href="鍛造.html">🔨 鍛造</a><a href="副本材料.html">🏰 副本材料&裝備</a><a href="攻略首頁.html">🎬 副本攻略</a><a href="材料.html">🧱 鍛造材料&合成商人</a><a href="裝備.html">📘 裝備資料庫</a><a href="NPC.html">📍 NPC位置</a><a href="職業.html" class="active">✨ 職業技能</a><a href="搜尋.html">🛡️ 配裝</a><a href="掉落率.html">🎲 掉落率</a><a href="存檔讀取.html">📂 存檔讀取</a></nav></header><main class="wrap"><h1>⚔️ 職業技能</h1><div class="skill-selector"><label for="classSelect">選擇職業</label><select id="classSelect"></select></div><div id="skillView"></div></main>
<footer class="site-footer"><div><strong>新暮光之晨</strong>　v2.74　｜　攻略資料庫・資料整合版</div><div>使用左上選單快速切換各頁功能</div></footer>
<script src="../skill-data.js"></script><script>const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const fmt=v=>esc(v).replaceAll('\n','<br>');const select=document.getElementById('classSelect'),view=document.getElementById('skillView');select.innerHTML=SKILL_DATA.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('');function render(i){const c=SKILL_DATA[Number(i)];view.innerHTML=`<section class="skill-character"><div class="skill-character-head">${c.portrait?`<img class="character-portrait" src="${c.portrait}" alt="${esc(c.name)}">`:''}<div><h2>${esc(c.name)}</h2><p class="muted">技能資料</p></div></div><div class="skill-list">${c.skills.map(s=>`<article class="skill-card"><div class="skill-icon-wrap">${(s.images||[]).map(im=>`<img class="skill-icon" src="${im}" loading="lazy" alt="${esc(s.name)}">`).join('')}</div><div class="skill-main"><div class="skill-title"><span class="skill-key">${esc(s.key)}</span><strong>${fmt(s.name)}</strong></div><div class="skill-meta"><span>等級上限：${esc(s.max)}</span><span>冷卻：${esc(s.cd)}</span></div><div class="skill-desc">${fmt(s.desc||'')}</div></div></article>`).join('')}</div></section>`}select.addEventListener('change',e=>render(e.target.value));render(0);</script><script src="../mobile-nav.js"></script>
</body></html>
