<script>
loadDB().then(d=>{
  const allItems=d.items||[];
  const recipeLookup=new Map();
  allItems.forEach(it=>{const n=String(it.name||'').trim();if(n&&it.materials&&!recipeLookup.has(n))recipeLookup.set(n,String(it.materials));});

  // 鍛造材料中文化：先吃目前 Excel / 網站已有的中英文對照。
  const materialZh=new Map();
  [...(d.items||[]),...(d.loot||[])].forEach(it=>{
    const en=String(it.name_en||'').trim(), zh=String(it.display_name||it.name||'').trim();
    if(en&&zh&&!materialZh.has(en.toLowerCase()))materialZh.set(en.toLowerCase(),zh);
  });
  const MATERIAL_ZH_EXTRA={
    'Golden Fragment':'黃金碎片','Lavender Fragment':'薰衣草碎片','Blood Fragment':'血腥碎片',
    'Nature Fragment':'自然碎片','Ocean Fragment':'海洋碎片','Quicksilver Fragment':'水銀碎片',
    'Ruby':'紅寶石','Sapphire':'藍寶石','Emerald':'翡翠寶石','Amethyst':'紫水晶','Diamond':'鑽石','Silver':'白銀',
    'Mythical Armor Piece':'神話盔甲碎片','Mythical Weapon Piece':'神話武器碎片','Mythical Handle Piece':'神話配件碎片',
    'Fabled Weapon Piece':'傳說武器碎片','Fire Stone':'火焰石','Tainted Gem':'污染寶石',
    'Dark Crystal Shard':'暗黑水晶碎片','Diamond of Nulgath':'努爾加斯鑽石',
    'Totem of Nulgath':'努爾加斯圖騰','Prismatic Sigil of Elements':'稜彩元素印記',
    'Unidentified 22':'未鑑定物品 22','Unidentified 23':'未鑑定物品 23',
    'Mystery':'謎','Mystical':'秘'
  };
  Object.entries(MATERIAL_ZH_EXTRA).forEach(([en,zh])=>{if(!materialZh.has(en.toLowerCase()))materialZh.set(en.toLowerCase(),zh)});

  function zhMaterialToken(token){
    const raw=String(token||'').trim();
    if(!raw)return raw;
    const m=raw.match(/^(.*?)(\s*[xX×*]\s*\d+)$/);
    const base=(m?m[1]:raw).trim(), suffix=m?m[2]:'';
    return (materialZh.get(base.toLowerCase())||base)+suffix;
  }
  function translateMaterialText(text){
    return String(text||'').split(/([,，、])/).map(part=>/^[,，、]$/.test(part)?part:zhMaterialToken(part)).join('');
  }

  const noTip=/^(?:稀有|史詩|傳說).*(?:碎片|武器碎片|盔甲碎片|配件碎片)$/;
  function materialWithTip(name){
    const original=String(name||'').trim(),n=zhMaterialToken(original);
    const recipe=recipeLookup.get(n)||recipeLookup.get(original);
    if(!recipe||noTip.test(n))return formatRarityText(n);
    return `<span class="mat-ref" tabindex="0">${formatRarityText(n)}<span class="mat-tip"><b>${esc(n)}</b><br>需要：${formatRarityText(translateMaterialText(recipe))}</span></span>`;
  }
  function formatMaterialList(text){
    return String(text||'').split(/([,，、])/).map(part=>/^[,，、]$/.test(part)?esc(part):materialWithTip(part.trim())).join(' ');
  }
  const general=allItems.filter(x=>x.type==='鍛造裝備' && x.source_sheet===' ② 鍛造裝備總表');
  const godly=allItems.filter(x=>x.type==='神祇鍛造');
  const byName=(name,prefer='鍛造裝備')=>{
    const pool=prefer==='神祇鍛造'?godly:general;
    return pool.find(x=>String(x.name||'').trim()===name) || allItems.find(x=>String(x.name||'').trim()===name);
  };
  const byRows=(min,max)=>general.filter(x=>x.row>=min&&x.row<=max);
  const names=(arr)=>arr.map(n=>byName(n)).filter(Boolean);

  const grouped=[];
  // 前四組維持 Excel 原順序。
  grouped.push({type:'鍛造裝備',name:'Weapon Master｜武器大師',list:byRows(4,14),filterKey:'武器大師',locationImage:'../images/forge-locations/weapon-master.png'});
  grouped.push({type:'鍛造裝備',name:'Bob the Builder｜鮑伯老師傅',list:byRows(17,20),filterKey:'鮑伯老師傅',locationImage:'../images/forge-locations/bob-the-builder.png'});
  grouped.push({type:'鍛造裝備',name:'Magic Wizard｜魔幻巫師',list:byRows(23,25),filterKey:'魔幻巫師',locationImage:'../images/forge-locations/magic-wizard.png'});
  grouped.push({type:'鍛造裝備',name:'Ancient Soul｜遠古靈魂',list:byRows(28,34),filterKey:'遠古靈魂',locationImage:'../images/forge-locations/ancient-soul.png'});

  // 天使區塊改為使用使用者確認過的固定清單，避免跨區與重複。
  grouped.push({type:'鍛造裝備',name:'雲の天使｜雲天使',filterKey:'雲天使',list:names([
    '腐化水晶','暗鑄甲','異能者之戒','發光球','海柏利昂','神秘法杖','流浪者','風語者','冷凍細胞','毀滅','惡毒'
  ]),locationImage:'../images/forge-locations/cloud-angel.png'});
  grouped.push({type:'鍛造裝備',name:'太陽の天使｜太陽天使',filterKey:'太陽天使',list:names([
    '絕望之刃','命運的致盲之光','海利亞之書','濃縮能量','殘酷之刃','詛咒之刃','龍磷盔甲','傳說中的龍珠','芙蕾雅傳說','靈魂射擊','星光水晶'
  ]),locationImage:'../images/forge-locations/sun-angel.png'});

  // 兄弟之血歸回原本的自然天使區，只在裝備名稱旁標示目前版本尚未推出。
  const naturalList=names([
    '爆破棒','龍圖騰','午夜之爪','凜冬之魂','龍弓','漢娜的咒術精華','夜影','大地的力量','最終翡翠之刃','瓶中綠洲'
  ]);
  const brothers=byName('兄弟之血');
  if(brothers) naturalList.unshift({...brothers,_unreleased:true});
  grouped.push({type:'鍛造裝備',name:'自然の天使｜自然天使',filterKey:'自然天使',list:naturalList,locationImage:'../images/forge-locations/nature-angel.png'});

  grouped.push({type:'鍛造裝備',name:'復讐の天使｜復仇的天使',list:byRows(76,79),filterKey:'復仇的天使',locationImage:'../images/forge-locations/revenge-angel.png'});
  grouped.push({type:'鍛造裝備',name:'炎の悪魔｜火之惡魔',list:byRows(82,92),filterKey:'火之惡魔',locationImage:'../images/forge-locations/fire-demon.png'});
  const flameList=byRows(95,103);
  ['國王的皇冠','皇后的皇冠','帝國皇冠'].forEach(n=>{const x=byName(n);if(x)flameList.push({...x,_unreleased:true});});
  grouped.push({type:'鍛造裝備',name:'焔の悪魔｜焰之惡魔',list:flameList,filterKey:'焰之惡魔',mixedAvailability:true,locationImage:'../images/forge-locations/flame-demon.png'});

  // 洗禮專屬武器排在異我化身上方。
  const exclusive=general.filter(x=>x.row>=178&&x.row<=191);
  if(exclusive.length) grouped.push({type:'專屬武器',name:'洗禮專屬武器',list:exclusive,filterKey:'洗禮專屬武器'});

  // 異我化身：保留目前版本已有裝備名稱；其餘 Wiki 項目僅顯示於鍛造頁，不加入配裝。
  const keepAlter=(name)=>{const x=byName(name);return x?{...x,name_color:'#ff3fd8',_unreleased:name!=='月魂珠'}:null};
  const alter=[
    keepAlter('命運的昇華之光'),
    keepAlter('拜爾納之杖'),
    keepAlter('危機核心'),
    keepAlter('奉獻'),
    keepAlter('德拉卡斯的盔甲'),
    {name:'Eliot',name_color:'#ff3fd8',name_en:'Eliot',job:'Melee Agility',effect:'+1425 Agility\n+10% Cooldown Speed\n+5% Movement Speed\nHunter II (Passive)',materials:'Hunter Strike, Golden Fragment, Dragon Tooth, Dragon Stone, Fire Stone, Angelic Hope',image:'../images/alter-ego/eliot.png',_unreleased:true},
    keepAlter('月魂珠'),
    keepAlter('末日死靈之劍'),
    keepAlter('邪惡法杖'),
    {name:'Sword of Akasha',name_color:'#ff3fd8',name_en:'Sword of Akasha',job:'Melee Agility',effect:'+1475 Agility\n+35% Attack Speed\nGhast (Passive)',materials:'Malevolent, Sphere of Doom, Mystical, Dragon Stone, Fire Stone, Angelic Hope',image:'../images/alter-ego/sword-of-akasha.png',_unreleased:true},
    {name:"Titan's Mitt",name_color:'#ff3fd8',name_en:"Titan's Mitt",job:'Melee',effect:'+150 Armor\n+875 Strength\n+25% Attack Speed\nTitan Strike (Passive)',materials:'Strength of the Earth, Diamond, Mantle of Darkness, Fire Stone, Angelic Hope',image:'../images/alter-ego/titans-mitt.png',_unreleased:true},
    {name:'Ungodly Reaper',name_color:'#ff3fd8',name_en:'Ungodly Reaper',job:'Melee',effect:'+10000 Attack Damage\nSoul Harvest (Passive)',materials:'Cruel Blade, Sphere of Doom, Mystery, Mystical, Fire Stone, Angelic Hope',image:'../images/alter-ego/ungodly-reaper.png',_unreleased:true}
  ].filter(Boolean);
  grouped.push({type:'鍛造裝備',name:'オルター・エゴ｜異我化身 (Alter Ego)',list:alter,filterKey:'異我化身',mixedAvailability:true,routeNote:'迷宮路徑｜M1 第一商店：第一個圓圈 → 下 → 右 → 上 → 接著沿單一路線前進'});

  // 亞古尼姆：依目前 Excel「② 鍛造裝備總表」同步。
  // 目前版本尚未推出；只顯示於鍛造頁，不加入配裝。
  const agahnim=[
    {name:'遠古徵兆',name_en:'Ancient Omen',job:'審判者',effect:'增加 400 全屬性, 7500 MP, 減少 20% 技能冷卻時間\n●被動:提供 75 護甲給附近友軍',materials:'重燃餘燼, 自然碎片, 紅寶石, 龍蛋, 龍石, 墮魂之望',image:'../images/agahnim/ancient-omen.png',name_color:'#ff3fd8',_unreleased:true},
    {name:'災禍',name_en:'Calamity',job:'弓箭手',effect:'增加 1500 點敏捷, 40% 攻擊速度\n●被動:增加15%傷害',materials:'風的代言人, 自然碎片, 龍牙, 龍石, 煉獄核, 墮魂之望',image:'../images/agahnim/calamity.png',name_color:'#ff3fd8',_unreleased:true},
    {name:'天界魔杖',name_en:'Celestial Wand',job:'所有智者',effect:'增加 1300 點智慧, 5000 MP, 15% 法力效益, 減少 15% 技能冷卻時間',materials:'漢娜的咒術精華, 海洋碎片, 藍寶石, 龍石, 煉獄核, 墮魂之望',image:'../images/agahnim/celestial-wand.png',name_color:'#ff3fd8',_unreleased:true},
    {name:'聖經',name_en:'',job:'德魯伊',effect:'增加 650 全屬性, 減少 15% 技能冷卻時間\n□技能:召喚天使, 持續50秒「冷卻時間60秒」',materials:'上古龍書, 黃金碎片, 龍蛋, 龍之祝福, 煉獄核, 墮魂之望',image:'../images/agahnim/bible.png',name_color:'#ff3fd8',_unreleased:true},
    {name:'海拉爾智慧之卷',name_en:'',job:'聖殿武士',effect:'增加 1600 智慧, 減少 15% 技能冷卻時間\n□技能:重製所有技能的冷卻時間「冷卻時間30秒」',materials:'芙蕾雅傳說, 鑽石, 黑暗斗篷, 龍石, 煉獄核, 墮魂之望',image:'../images/agahnim/hyrule-wisdom-scroll.png',name_color:'#ff3fd8',_unreleased:true},
