<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📘 裝備資料庫</title><link rel="icon" href="../images/site-icon.png">
<link rel="stylesheet" href="../style.css"><style>
.eq-toolbar{display:grid;grid-template-columns:minmax(300px,1fr) minmax(260px,360px) 190px;gap:12px;margin:18px 0 18px;position:sticky;top:76px;z-index:5;background:rgba(11,15,20,.95);padding:12px 0;backdrop-filter:blur(8px)}.eq-toolbar .search{margin:0}.eq-toolbar select{padding:14px 15px;background:#10151c;border:1px solid #303947;border-radius:10px;color:#fff;font-size:16px}.eq-count{margin:-2px 0 18px;color:#8e99a8;font-size:15px}.equipment-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px}.equipment-card{display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;background:#121821;border:1px solid #252e3a;border-radius:16px;padding:18px;min-height:210px}.equipment-card.is-unreleased{border-color:#633b43;background:linear-gradient(180deg,#161821,#121820)}.eq-img{width:108px;height:108px;object-fit:contain;object-position:center;background:#080b0f;border:1px solid #2c3541;border-radius:12px;padding:3px;box-sizing:border-box}.eq-main h2{font-size:23px;margin:2px 0 3px}.eq-en{font-size:15px;color:#9eb1c8;margin-bottom:8px}.eq-job{font-size:15px;color:#c1cad5}.eq-section{margin-top:12px}.eq-label{font-size:14px;font-weight:900;color:#f0d690;margin-bottom:3px}.eq-text{font-size:16px;line-height:1.65;color:#d4dce6;white-space:pre-wrap}.eq-materials{color:#b8c4d2}.eq-tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#26313e;font-size:13px;color:#e3e9f0;margin:0 5px 5px 0}.eq-source-forge{color:#e6b85f;border:1px solid #6f5932;background:#211c13}.eq-source-dungeon{color:#8fd0ff;border:1px solid #35596f;background:#0f1d29}.eq-source-gold{color:#f1d06b;border:1px solid #77652e;background:#241f10}.eq-unreleased{color:#ffb8b8;border:1px solid #8b4a4a;background:#4c2929;font-weight:900}.eq-empty{grid-column:1/-1;padding:32px;text-align:center;color:#8e99a8;background:#121821;border:1px solid #252e3a;border-radius:14px}
.eq-note{font-size:14px;line-height:1.6;color:#91a0b3;margin-bottom:6px}.eq-note b{color:#d7e0eb}
@media(max-width:900px){.eq-toolbar{grid-template-columns:1fr 1fr}.eq-toolbar .search{grid-column:1/-1}.equipment-list{grid-template-columns:1fr}}@media(max-width:720px){.eq-toolbar{grid-template-columns:1fr;top:64px}.eq-toolbar .search{grid-column:auto}.equipment-card{grid-template-columns:84px 1fr;gap:12px;padding:14px}.eq-img{width:80px;height:80px}.eq-main h2{font-size:20px}}
</style></head><body><header class="top"><nav class="nav"><a class="brand" href="../index.html" aria-label="新暮光之晨 首頁"><img class="brand-logo" src="../images/site-icon.png" alt="新暮光之晨 icon"><span class="brand-title"><span class="brand-name">新暮光之晨</span><span class="brand-version">v2.74</span></span></a><a href="../index.html">🏠 首頁</a><a href="鍛造.html">🔨 鍛造</a><a href="副本材料.html">🏰 副本材料&裝備</a><a href="攻略首頁.html">🎬 副本攻略</a><a href="材料.html">🧱 鍛造材料&合成商人</a><a href="裝備.html" class="active">📘 裝備資料庫</a><a href="NPC.html">📍 NPC位置</a><a href="職業.html">✨ 職業技能</a><a href="搜尋.html">🛡️ 配裝</a></nav></header><main class="wrap"><h1>🗡️ 裝備資料庫</h1><div class="eq-note">整合 <b>鍛造 + 副本材料&裝備 + 尚未推出的 Wiki 鍛造資料</b>；相同裝備只保留一筆，未推出項目會顯示「版本尚未推出」。</div><div class="eq-toolbar"><input id="q" class="search" placeholder="搜尋裝備、職業、效果、材料…"><select id="source"><option value="">全部出處</option></select><select id="status"><option value="">全部版本</option><option value="released">已推出</option><option value="unreleased">版本尚未推出</option></select></div><div id="count" class="eq-count"></div><div id="items" class="equipment-list"></div></main>
<footer class="site-footer"><div><strong>新暮光之晨</strong>　v2.74　｜　攻略資料庫・資料整合版</div><div>使用左上選單快速切換各頁功能</div></footer>
<script src="../app-data.js"></script><script src="../loadout-rules.js"></script><script src="../extra-equipment-data.js"></script><script>
loadDB().then(d=>{
 const q=document.getElementById('q'),source=document.getElementById('source'),status=document.getElementById('status'),items=document.getElementById('items'),count=document.getElementById('count');
 const rules=[...(typeof LOADOUT_EQUIPMENT_RULES!=='undefined'?LOADOUT_EQUIPMENT_RULES:[])];
 const ruleByName=new Map(),ruleByEn=new Map();rules.forEach(r=>{if(r.name)ruleByName.set(norm(r.name),r);if(r.name_en)ruleByEn.set(norm(r.name_en),r)});
 function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
 function ruleFor(x){return ruleByName.get(norm(x.name))||ruleByEn.get(norm(x.name_en))||null}
 function isUnreleased(x){const r=ruleFor(x);return !!x._unreleased || (r&&r.status==='現版本尚未出') || /版本尚未出|版本尚未推出/.test(String(x.dungeon||''))}
 function forgeGroupFromRow(x){const r=Number(x.row||0),n=String(x.name||'');if(r>=4&&r<=14)return'Weapon Master｜武器大師';if(r>=17&&r<=20)return'Bob the Builder｜鮑伯老師傅';if(r>=23&&r<=25)return'Magic Wizard｜魔幻巫師';if(r>=28&&r<=34)return'Ancient Soul｜遠古靈魂';if(r>=76&&r<=79)return'復讐の天使｜復仇的天使';if(r>=82&&r<=92)return'炎の悪魔｜火之惡魔';if(r>=95&&r<=103)return'焔の悪魔｜焰之惡魔';if(r>=178&&r<=191)return'洗禮專屬武器';const cloud=['腐化水晶','暗鑄甲','異能者之戒','發光球','海柏利昂','神秘法杖','流浪者','風語者','冷凍細胞','毀滅','惡毒'];const sun=['絕望之刃','命運的致盲之光','海利亞之書','濃縮能量','殘酷之刃','詛咒之刃','龍磷盔甲','傳說中的龍珠','芙蕾雅傳說','靈魂射擊','星光水晶'];const nature=['兄弟之血','爆破棒','龍圖騰','午夜之爪','凜冬之魂','龍弓','漢娜的咒術精華','夜影','大地的力量','最終翡翠之刃','瓶中綠洲'];if(cloud.includes(n))return'雲の天使｜雲天使';if(sun.includes(n))return'太陽の天使｜太陽天使';if(nature.includes(n))return'自然の天使｜自然天使';return x.type==='神祇鍛造'?'神祇鍛造':'其他鍛造'}
 function categoryFor(x){if(x._db_group)return'forge::'+x._db_group;const r=ruleFor(x);if(x._origin==='loot')return'dungeon::'+String(x.dungeon||'其他副本').replace(/\s*（?版本尚未出[）)]?/g,'').trim();if(r&&r.sourceType==='鍛造裝備')return'forge::'+(r.sourceGroup||forgeGroupFromRow(x));if(r&&r.sourceType==='副本裝備')return'dungeon::'+(r.sourceGroup||x.dungeon||'其他副本');return'forge::'+forgeGroupFromRow(x)}
 function sourceLabel(cat){const [kind,...rest]=cat.split('::');const name=rest.join('::');return(kind==='dungeon'?'副本掉落｜':'鍛造｜')+name}
 function sourceClass(cat){if(/M1|洗禮專屬武器/.test(cat))return'eq-source-gold';return cat.startsWith('dungeon::')?'eq-source-dungeon':'eq-source-forge'}
 const raw=[...(d.items||[]).map(x=>({...x,_origin:'forge'})),...(d.loot||[]).map(x=>({...x,_origin:'loot'})),...(typeof EXTRA_EQUIPMENT_DB!=='undefined'?EXTRA_EQUIPMENT_DB:[]).map(x=>({...x,_origin:'forge-extra'}))];
 const dedup=new Map();raw.forEach(x=>{const key=norm(x.name)||norm(x.name_en);if(!key)return;const prev=dedup.get(key);if(!prev||x._origin==='forge-extra'||(!prev.effect&&x.effect))dedup.set(key,x)});
 const all=[...dedup.values()].map(x=>({...x,_category:categoryFor(x),_unreleasedFinal:isUnreleased(x)}));
 const cats=[...new Set(all.map(x=>x._category))];const forgeCats=cats.filter(x=>x.startsWith('forge::')).sort((a,b)=>sourceLabel(a).localeCompare(sourceLabel(b),'zh-Hant'));const dungeonCats=cats.filter(x=>x.startsWith('dungeon::')).sort((a,b)=>sourceLabel(a).localeCompare(sourceLabel(b),'zh-Hant'));
 source.innerHTML='<option value="">全部出處</option>'+(forgeCats.length?'<optgroup label="鍛造">'+forgeCats.map(c=>`<option value="${esc(c)}">${esc(sourceLabel(c))}</option>`).join('')+'</optgroup>':'')+(dungeonCats.length?'<optgroup label="副本掉落">'+dungeonCats.map(c=>`<option value="${esc(c)}">${esc(sourceLabel(c))}</option>`).join('')+'</optgroup>':'');
 function render(){const qq=q.value.trim().toLowerCase(),cat=source.value,st=status.value;const list=all.filter(x=>(!cat||x._category===cat)&&(!st||(st==='unreleased')===x._unreleasedFinal)&&(!qq||((x.display_name||x.name)+' '+(x.display_name_en||x.name_en)+' '+(x.job||'')+' '+(x.effect||'')+' '+(x.materials||'')+' '+sourceLabel(x._category)).toLowerCase().includes(qq)));count.textContent=`顯示 ${list.length} / ${all.length} 筆（已自動移除重複）`;items.innerHTML=list.map(x=>{const nm=x.display_name||x.name,en=x.display_name_en||x.name_en,src=sourceLabel(x._category),color=x.name_color||'#f3f6fa';return`<article class="equipment-card${x._unreleasedFinal?' is-unreleased':''}"><div>${x.image?`<img class="eq-img" src="${esc(resolveImage(x))}" loading="lazy" alt="${esc(nm)}">`:''}</div><div class="eq-main"><span class="eq-tag ${sourceClass(x._category)}">${esc(src)}</span>${x._unreleasedFinal?'<span class="eq-tag eq-unreleased">版本尚未推出</span>':''}<h2 style="color:${esc(color)}">${esc(nm)}</h2>${en&&norm(en)!==norm(nm)?`<div class="eq-en">${esc(en)}</div>`:''}${x.job?`<div class="eq-job">適用職業：${formatText(x.job)}</div>`:''}<div class="eq-section"><div class="eq-label">效果</div><div class="eq-text">${formatText(x.effect||'—')}</div></div><div class="eq-section"><div class="eq-label">需求素材</div><div class="eq-text eq-materials">${formatRarityText(x.materials||'—')}</div></div></div></article>`}).join('')||'<div class="eq-empty">找不到符合條件的裝備。</div>'}
 q.oninput=render;source.onchange=render;status.onchange=render;render();
}).catch(e=>document.getElementById('items').innerHTML='<div class="eq-empty">資料載入失敗：'+esc(e.message)+'</div>');
</script><script src="../mobile-nav.js"></script></body></html>
