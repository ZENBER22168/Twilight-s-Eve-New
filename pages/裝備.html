<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📘 裝備資料庫</title><link rel="icon" href="../images/site-icon.png">
<link rel="stylesheet" href="../style.css"><style>
.eq-toolbar{display:grid;grid-template-columns:minmax(260px,1fr) 230px;gap:12px;margin:18px 0 24px;position:sticky;top:76px;z-index:5;background:rgba(11,15,20,.95);padding:12px 0;backdrop-filter:blur(8px)}.eq-toolbar .search{margin:0}.eq-toolbar select{padding:14px 15px;background:#10151c;border:1px solid #303947;border-radius:10px;color:#fff;font-size:17px}
.eq-count{margin:-8px 0 18px;color:#8e99a8;font-size:15px}.equipment-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px}.equipment-card{display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;background:#121821;border:1px solid #252e3a;border-radius:16px;padding:18px;min-height:210px}.eq-img{width:108px;height:108px;object-fit:contain;background:#080b0f;border:1px solid #2c3541;border-radius:12px;padding:5px}.eq-main h2{font-size:23px;margin:2px 0 3px}.eq-en{font-size:15px;color:#9eb1c8;margin-bottom:8px}.eq-job{font-size:15px;color:#c1cad5}.eq-section{margin-top:12px}.eq-label{font-size:14px;font-weight:900;color:#f0d690;margin-bottom:3px}.eq-text{font-size:16px;line-height:1.65;color:#d4dce6;white-space:pre-wrap}.eq-materials{color:#b8c4d2}.eq-tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#26313e;font-size:13px;color:#e3e9f0;margin-bottom:4px}.eq-empty{grid-column:1/-1;padding:32px;text-align:center;color:#8e99a8;background:#121821;border:1px solid #252e3a;border-radius:14px}
@media(max-width:720px){.eq-toolbar{grid-template-columns:1fr;top:64px}.equipment-list{grid-template-columns:1fr}.equipment-card{grid-template-columns:84px 1fr;gap:12px;padding:14px}.eq-img{width:80px;height:80px}.eq-main h2{font-size:20px}}
</style></head><body><header class="top"><nav class="nav"><a class="brand" href="../index.html" aria-label="新暮光之晨 首頁"><img class="brand-logo" src="../images/site-icon.png" alt="新暮光之晨 icon"><span class="brand-title"><span class="brand-name">新暮光之晨</span><span class="brand-version">v2.74</span></span></a><a href="../index.html">🏠 首頁</a><a href="鍛造.html">🔨 鍛造</a><a href="副本材料.html">🏰 副本材料&裝備</a><a href="材料.html">🧱 鍛造材料&合成商人</a><a href="裝備.html" class="active">📘 裝備資料庫</a><a href="NPC.html">📍 NPC位置</a><a href="職業.html">✨ 職業技能</a><a href="搜尋.html">🛡️ 配裝</a></nav></header><main class="wrap"><h1>🗡️ 裝備資料庫</h1><p class="muted">重新整理成左右式裝備卡片，圖示、名稱、職業、效果和需求素材更容易一起閱讀。</p><div class="eq-toolbar"><input id="q" class="search" placeholder="搜尋裝備、職業、效果、材料…"><select id="type"><option value="">全部分類</option><option value="鍛造裝備">鍛造裝備</option><option value="神祇鍛造">神祇鍛造</option></select></div><div id="count" class="eq-count"></div><div id="items" class="equipment-list"></div></main>
<footer class="site-footer"><div><strong>新暮光之晨</strong>　v2.74　｜　攻略資料庫・資料整合版</div><div>使用左上選單快速切換各頁功能</div></footer>
<script src="../app-data.js"></script><script>
loadDB().then(d=>{const all=d.items||[],q=document.getElementById('q'),type=document.getElementById('type'),items=document.getElementById('items'),count=document.getElementById('count');function render(){const qq=q.value.trim().toLowerCase(),t=type.value;const list=all.filter(x=>(!t||x.type===t)&&(!qq||(x.name+x.name_en+x.job+x.effect+x.materials).toLowerCase().includes(qq)));count.textContent=`顯示 ${list.length} / ${all.length} 件裝備`;items.innerHTML=list.map(x=>`<article class="equipment-card"><div>${x.image?`<img class="eq-img" src="${esc(resolveImage(x))}" loading="lazy" alt="${esc(x.name)}">`:''}</div><div class="eq-main"><span class="eq-tag">${esc(x.type)}</span><h2>${esc(x.name)}</h2><div class="eq-en">${esc(x.name_en)}</div>${x.job?`<div class="eq-job">適用職業：${formatText(x.job)}</div>`:''}<div class="eq-section"><div class="eq-label">效果</div><div class="eq-text">${formatText(x.effect||'—')}</div></div><div class="eq-section"><div class="eq-label">需求素材</div><div class="eq-text eq-materials">${formatRarityText(x.materials||'—')}</div></div></div></article>`).join('')||'<div class="eq-empty">找不到符合條件的裝備。</div>';}q.oninput=render;type.onchange=render;render();}).catch(e=>document.getElementById('items').innerHTML='<div class="eq-empty">資料載入失敗：'+esc(e.message)+'</div>');
</script></body></html>
