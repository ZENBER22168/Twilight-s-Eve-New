<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📍 NPC位置</title><link rel="icon" href="../images/site-icon.png">
<link rel="stylesheet" href="../style.css"><style>
.npc-selector{display:flex;align-items:center;gap:14px;margin:18px 0 24px;padding:16px 18px;background:#121821;border:1px solid #252e3a;border-radius:14px}.npc-selector label{font-size:19px;font-weight:800}.npc-selector select{min-width:320px;max-width:100%;padding:13px 16px;background:#0e141b;color:#fff;border:1px solid #35404d;border-radius:9px;font-size:18px}
.selected-route{background:#121821;border:1px solid #252e3a;border-radius:18px;padding:20px}.route-stage-group{margin-bottom:24px}.route-stage-group:last-child{margin-bottom:0}.route-stage-title{font-size:22px;font-weight:900;margin:0 0 12px;color:#f0d690}.route-stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}.npc-big-card{background:#0f151d;border:1px solid #29323e;border-radius:14px;padding:16px}.npc-big-name{font-size:23px;font-weight:900;margin-bottom:12px}.npc-big-images{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.npc-big-images img{width:100%;height:auto;max-height:620px;object-fit:contain;background:#080b0f;border:1px solid #29313c;border-radius:12px}.npc-empty{padding:30px;text-align:center;color:#8e99a8}
@media(max-width:700px){.npc-selector{align-items:flex-start;flex-direction:column}.npc-selector select{width:100%;min-width:0}.route-stage-grid{grid-template-columns:1fr}.npc-big-images{grid-template-columns:1fr}.npc-big-name{font-size:20px}}
</style></head><body><header class="top"><nav class="nav"><a class="brand" href="../index.html" aria-label="新暮光之晨 首頁"><img class="brand-logo" src="../images/site-icon.png" alt="新暮光之晨 icon"><span class="brand-title"><span class="brand-name">新暮光之晨</span><span class="brand-version">v2.74</span></span></a><a href="../index.html">🏠 首頁</a><a href="鍛造.html">🔨 鍛造</a><a href="副本材料.html">🏰 副本材料&裝備</a><a href="攻略首頁.html">🎬 副本攻略</a><a href="材料.html">🧱 鍛造材料&合成商人</a><a href="裝備.html">📚 資料庫</a><a href="NPC.html" class="active">📍 NPC位置</a><a href="職業.html">✨ 職業技能</a><a href="搜尋.html">👤 角色讀取&配裝</a></nav></header><main class="wrap"><h1>👤 轉職 NPC 位置</h1><p class="muted">改成選單式查看，一次只顯示一條轉職路線，讓 NPC 位置圖可以放得更大、更清楚。</p><div class="npc-selector"><label for="routeSelect">選擇轉職路線</label><select id="routeSelect"></select></div><div id="npcRouteView"></div></main>
<footer class="site-footer"><div><strong>新暮光之晨</strong>　v2.74　｜　攻略資料庫・資料整合版</div><div>使用左上選單快速切換各頁功能</div></footer>
<script src="../npc-data.js"></script><script>
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const select=document.getElementById('routeSelect'),view=document.getElementById('npcRouteView');
select.innerHTML=NPC_ROUTES.map((r,i)=>`<option value="${i}">${esc(r.name||r.title||r.stages?.[0]?.name||('路線 '+(i+1)))}</option>`).join('');
function renderRoute(i){const r=NPC_ROUTES[Number(i)]||NPC_ROUTES[0];if(!r){view.innerHTML='<div class="npc-empty">沒有 NPC 路線資料。</div>';return;}const s=r.stages||[];const map=new Map([['一轉',[]],['二轉',[]],['三轉',[]],['四轉',[]]]);let lastStage='';s.forEach(x=>{if(map.has(x.stage)){lastStage=x.stage;map.get(x.stage).push(x);}else if(x.stage==='None'&&lastStage&&map.has(lastStage)){map.get(lastStage).push(x);}});const groups=[...map.entries()].filter(([,items])=>items.length).map(([label,items])=>({label,items}));view.innerHTML=`<section class="selected-route">${groups.map(g=>`<div class="route-stage-group"><div class="route-stage-title">${g.label}</div><div class="route-stage-grid">${g.items.map(x=>`<article class="npc-big-card"><div class="npc-big-name">${esc(x.name)}</div><div class="npc-big-images">${(x.images||[]).map((im,j)=>`<img src="${im}" loading="lazy" alt="${esc(x.name)} NPC位置圖 ${j+1}">`).join('')}</div></article>`).join('')}</div></div>`).join('')}</section>`;}
select.addEventListener('change',e=>renderRoute(e.target.value));renderRoute(0);
</script><script src="../mobile-nav.js"></script>
</body></html>
