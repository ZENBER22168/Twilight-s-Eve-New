<link rel="stylesheet" href="../style.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="../index.html" aria-label="新暮光之晨 首頁"><img class="brand-logo" src="../images/site-icon.png" alt="新暮光之晨 icon"><span class="brand-title"><span class="brand-name">新暮光之晨</span><span class="brand-version">v2.74</span></span></a><a href="../index.html">🏠 首頁</a><a href="鍛造.html">🔨 鍛造</a><a href="副本材料.html">🏰 副本材料&裝備</a><a href="材料.html">🧱 鍛造材料&合成商人</a><a href="裝備.html">📘 裝備資料庫</a><a href="NPC.html">📍 NPC位置</a><a href="職業.html">✨ 職業技能</a><a href="搜尋.html">🛡️ 配裝</a></nav></header><main class="wrap"><h1>🏰 副本掉落</h1><p class="muted">依 Excel 副本掉落表整理，搜尋後可快速找到裝備。</p><input id="q" class="search" placeholder="搜尋副本、裝備、職業…"><div id="loot" class="item-grid"></div></main>
<footer class="site-footer"><div><strong>新暮光之晨</strong>　v2.74　｜　攻略資料庫・資料整合版</div><div>使用左上選單快速切換各頁功能</div></footer>
<script src="../app-data.js"></script><script>loadDB().then(d=>{let a=d.loot;function render(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("loot").innerHTML=a.filter(x=>(x.dungeon+x.name+x.name_en+x.job+x.effect).toLowerCase().includes(q)).map(x=>`<article class="card item">${x.image?`<img src="${esc(resolveImage(x))}" loading="lazy" style="width:64px;height:64px;object-fit:contain;float:left;margin-right:12px" alt="${esc(x.name)}" title="${esc(x.image_name||x.name)}">`:""}<span class="tag">${esc(x.dungeon)}</span><h2>${esc(x.name)}</h2><div class="muted">${esc(x.name_en)} · ${esc(x.job)}</div><p class="effect">${esc(x.effect)}</p></article>`).join("")}document.getElementById("q").oninput=render;render()})</script></body></html>
