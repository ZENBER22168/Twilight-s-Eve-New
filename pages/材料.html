<script src="../app-data.js"></script><script>
Promise.resolve(loadDB()).then(d=>{ const L=EMBEDDED_LAYOUT;
 const root=document.getElementById('root'),q=document.getElementById('q'),sel=document.getElementById('merchant');
 const icons=(d.images||[]).filter(im=>im.sheet==='③ 材料&合成商人');
 function iconFor(x){
  if(x.image) return x.image;
  const hit=icons.find(im=>Number(im.row)===Number(x.excel_row)&&Number(im.col)===1);
  return hit?hit.file:'';
 }
 function merchantTitle(g){
  const needsTwilight=(g.title==='死亡の悪魔'||g.title==='苦痛の悪魔');
  return `${esc(g.title)}${needsTwilight?'<span class="merchant-access-note">（須攜帶 暮光 在身上才能進入）</span>':''}`;
 }

   {n:'Gem of Nulgath',cn:'',img:'gem-of-nulgath.png',c:'pink',req:'12x Mysterious Orbs\nUnidentified 13',cost:"Blood Abyss\nHex Abyss\nShadow Abyss\nHarbinger's Heart\nPure Light Synthesis",future:true},
   {n:'Totem of Nulgath',cn:'',img:'totem-of-nulgath.png',c:'pink',req:'16x Mysterious Orbs\nUnidentified 13',cost:'Essence of Nulgath\nGem of Nulgath\nPure Ignited Incinerator\nPure Light Synthesis',future:true}

  {title:'ハイラルの僕｜Hyrule Servant',rows:[

 const allMerchantLabels=[...normalGroups.map((g,i)=>({kind:'normal',i,title:g.title})),...wikiGroups.map((g,i)=>({kind:'wiki',i,title:g.title}))];
 allMerchantLabels.forEach((m,idx)=>{const o=document.createElement('option');o.value=String(idx);o.textContent=m.title;sel.appendChild(o)});
 function normalHtml(g,qq){
  const list=d.materials.filter(x=>x.row>=g.start-1&&x.row<=g.end-1 && (!qq || (g.title+x.name+x.name_en+x.cost+x.extra).toLowerCase().includes(qq)));
  if(!list.length)return '';
  let html=`<section class="data-section material-table"><header class="data-section-title"><h2>${merchantTitle(g)}</h2><p>${list.length} 項材料／合成</p></header><div class="section-layout"><div class="section-table"><div class="excel-head"><div>圖示</div><div>材料名稱（中／英）</div><div>價格／合成需求</div></div>`;
  html+=list.sort((a,b)=>(a.row||0)-(b.row||0)).map(x=>`<article class="excel-row"><div>${iconFor(x)?`<img class="item-img" src="${esc(iconFor(x))}" loading="lazy" alt="${esc(x.name)}">`:'<div></div>'}</div><div class="item-name"><strong>${formatRarityText(x.name)}</strong>${x.name_en?`<span>${esc(x.name_en)}</span>`:''}</div><div class="cost">${formatRarityText(x.cost)}${x.extra?`<br>${formatRarityText(x.extra)}`:''}</div></article>`).join('');
  html+=`</div><aside class="side-panel"><div class="side-panel-title">📍 商人／合成位置圖</div>${g.images.length?g.images.map(im=>`<img class="side-main" src="${esc(im.file)}" loading="lazy" alt="${esc(g.title)} 對應圖片">`).join(''):''}<div class="side-note">圖片沿用 Excel 原本放在該商人區塊旁邊的圖片，方便對照遊戲內位置。</div></aside></div></section>`;
  return html;
 }
 function wikiHtml(g,qq){
  const rows=g.rows.filter(r=>!qq||(g.title+' '+r.n+' '+r.cn+' '+r.req+' '+r.cost).toLowerCase().includes(qq));
  if(!rows.length)return '';
  let html=`<section class="data-section material-table wiki-material-table wiki-no-side"><header class="data-section-title"><h2>${esc(g.title)}</h2><p>${rows.length} 項材料／合成</p><div class="wiki-source-note">依照你提供的 Wiki 表格整理；紅色「版本尚未出」代表目前攻略表版本尚未實裝。</div></header><div class="section-layout"><div class="section-table"><div class="excel-head"><div>圖示</div><div>Name</div><div>Requires</div><div>Cost</div></div>`;
  html+=rows.map(r=>`<article class="excel-row"><div><img class="item-img" src="../images/wiki-materials/${esc(r.img)}" loading="lazy" alt="${esc(r.n)}"></div><div><div class="wiki-name ${r.c}">${esc(r.n)}${r.future?'<span class="future-badge">版本尚未出</span>':''}</div>${r.cn?`<span class="wiki-cn">${esc(r.cn)}</span>`:''}</div><div class="wiki-requires">${esc(r.req)}</div><div class="wiki-cost">${esc(r.cost)}</div></article>`).join('');
  html+=`</div></div></section>`; return html;
 }
 function render(){const qq=q.value.trim().toLowerCase(),pick=sel.value;let html='';
  allMerchantLabels.forEach((m,idx)=>{if(pick!==''&&pick!==String(idx))return; html+=m.kind==='normal'?normalHtml(normalGroups[m.i],qq):wikiHtml(wikiGroups[m.i],qq)});
  root.innerHTML=html||'<div class="empty">找不到符合的商人或材料。</div>';
 }
 q.oninput=render;sel.onchange=render;render();
}).catch(e=>document.getElementById('root').innerHTML='<div class="notice">資料載入失敗：'+esc(e.message)+'</div>');
</script><script src="../mobile-nav.js"></script>
