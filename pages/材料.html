 function colorClass(c){return c==='yellow'?'name-yellow':c==='pink'?'name-pink':'name-white'}
 function iconFor(x){
   if(x.image) return x.image;
   const hit=icons.find(im=>Number(im.row)===Number(x.excel_row)&&Number(im.col)===1);
   return hit?hit.file:'';
 }
 function merchantTitle(g){
   const needsTwilight=(g.title==='死亡の悪魔'||g.title==='苦痛の悪魔');
   return `${esc(g.title)}${needsTwilight?'<span class="merchant-access-note">（須攜帶 暮光 在身上才能進入）</span>':''}`;
 }
 const normalGroups=L.material_groups.filter(g=>!g.title.includes('ハイラルの占い師')&&!g.title.includes('ハイラルの僕'));
 const allMerchantLabels=[...normalGroups.map((g,i)=>({kind:'normal',i,title:g.title})),...wikiGroups.map((g,i)=>({kind:'wiki',i,title:g.title}))];
 allMerchantLabels.forEach((m,idx)=>{const o=document.createElement('option');o.value=String(idx);o.textContent=m.title;sel.appendChild(o)});
 function translateLine(line){
   const raw=String(line||'').trim();
   if(!raw||raw==='-'||raw==='—') return '';
   if(MATERIAL_COMPOSITE_MAP[raw]) return MATERIAL_COMPOSITE_MAP[raw];
   if(raw==='or') return '或';
   if(raw==='+') return '＋';
   const m=raw.match(/^(\d+)x\s+(.+)$/i);
   if(m){ const n=m[1],name=m[2].trim(); return `${zhName(name)||name} ×${n}`; }
   const m2=raw.match(/^(.+?)\s*\*\s*(\d+)$/);
   if(m2){ const name=m2[1].trim(),n=m2[2]; return `${zhName(name)||name} ×${n}`; }
   return zhName(raw)||raw;
 }
 function formatMergedRecipe(req,cost){
   const lines=[];
   const collect=(txt)=>String(txt||'').split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{const t=translateLine(s);if(t)lines.push(t)});
   collect(req); collect(cost);
   if(!lines.length) return '—';
   const complex=lines.some(x=>x==='或'||x==='＋');

 }

   const rows=g.rows.filter(r=>!qq||(g.title+' '+r.n+' '+r.cn+' '+r.req+' '+r.cost).toLowerCase().includes(qq));
   if(!rows.length)return '';
   let html=`<section class="data-section material-table wiki-no-side"><header class="data-section-title"><h2>${esc(g.title)}</h2><p>${rows.length} 項材料／合成</p><div class="wiki-source-note">已改成中文優先、英文副標，並把需求材料翻成中文，排版也對齊目前材料頁的卡片列表樣式。</div></header><div class="section-layout"><div class="section-table"><div class="excel-head"><div>圖示</div><div>材料名稱（中／英）</div><div>需求材料</div></div>`;
   html+=rows.map(r=>{ const zh=r.cn||zhName(r.n)||r.n; const en=r.n; return `<article class="excel-row"><div><img class="item-img" src="../images/wiki-materials/${esc(r.img)}" loading="lazy" alt="${esc(zh)}"></div><div class="item-name"><strong class="${colorClass(r.c)}">${esc(zh)}${r.future?'<span class="future-badge">版本尚未出</span>':''}</strong>${en&&en!==zh?`<span>${esc(en)}</span>`:''}</div><div class="cost">${formatMergedRecipe(r.req,r.cost)}</div></article>`}).join('');
   html+=`</div></div></section>`;
   return html;
 }
 function render(){
   const qq=q.value.trim().toLowerCase(),pick=sel.value;let html='';
   allMerchantLabels.forEach((m,idx)=>{if(pick!==''&&pick!==String(idx))return; html+=m.kind==='normal'?normalHtml(normalGroups[m.i],qq):wikiHtml(wikiGroups[m.i],qq)});
   root.innerHTML=html||'<div class="empty">找不到符合的商人或材料。</div>';
 }
 q.oninput=render;sel.onchange=render;render();
}).catch(e=>document.getElementById('root').innerHTML='<div class="notice">資料載入失敗：'+esc(e.message)+'</div>');
</script><script src="../mobile-nav.js"></script>
