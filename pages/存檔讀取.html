<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>存檔讀取｜新暮光之晨</title><link rel="icon" href="../images/site-icon.png"><link rel="stylesheet" href="../style.css">
<style>
.reader-wrap{max-width:1180px;margin:0 auto}.reader-note{padding:14px 16px;border:1px solid #344356;border-radius:14px;background:#0d141d;color:#cbd7e5;line-height:1.7}.reader-note strong{color:#ffd46a}
.reader-upload{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0 10px}.reader-upload input,.reader-upload select{padding:12px;background:#101821;border:1px solid #344356;border-radius:10px;color:#fff}.reader-btn{padding:12px 18px;border:1px solid #6c5a2b;border-radius:10px;background:#2b2415;color:#ffd979;font-weight:900;cursor:pointer}.reader-btn.primary{background:#392e18;border-color:#a47d2f}.reader-btn.secondary{background:#111a24;border-color:#3a4a5d;color:#d8e3ef}.folder-picker{display:none}.reader-hints{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.reader-hint{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #283646;border-radius:999px;background:#0b121a;color:#9fb0c4;font-size:12px;line-height:1.45}.reader-hint strong{color:#dce7f3}.save-picker-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:12px 14px;border:1px solid #283646;border-radius:12px;background:#0b121a}.save-picker-wrap label{font-weight:900;color:#d9e5f1}.save-picker-wrap select{min-width:min(520px,100%);max-width:100%;padding:10px 12px;background:#101821;border:1px solid #344356;border-radius:9px;color:#fff}.scan-summary{color:#8fa2b8;font-size:13px}.auto-badge{display:inline-flex;align-items:center;padding:4px 9px;border:1px solid #6d5a2b;border-radius:999px;background:#2a2112;color:#ffd876;font-size:12px;font-weight:900}
.reader-card{border:1px solid #29323e;border-radius:16px;background:#0e151e;padding:18px;margin:18px 0}.reader-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:12px;border:1px solid #283646;border-radius:12px;background:#0a1017}.stat b{display:block;color:#8fa2b8;font-size:12px}.stat strong{display:block;margin-top:4px;color:#fff;font-size:20px}
.slot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.slot{padding:12px;border:1px solid #2c3948;border-radius:12px;background:#0b1118}.slot{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center}.item-icon{width:52px;height:52px;object-fit:contain;border:1px solid #2d3b49;border-radius:8px;background:#070b10}.slot .n{font-weight:900;color:#f2f5f8}.slot .en{color:#9fb0c4;font-size:13px;margin-top:3px}.slot .raw{display:none!important}.slot .qty{color:#ffd56d;margin-top:6px;font-size:15px;font-weight:900}.reader-btn:disabled{opacity:.45;cursor:not-allowed}.slot-body{min-width:0}
.stash-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.stash-tabs button{padding:9px 13px;border:1px solid #344356;border-radius:999px;background:#101821;color:#c8d4e3;cursor:pointer}.stash-tabs button.active{border-color:#b88d36;color:#ffd876;background:#2a2112}
.summary-table{width:100%;border-collapse:collapse}.summary-table td{padding:10px 8px;border-bottom:1px solid #25303d}.summary-table td:last-child{text-align:right;color:#ffd56d;font-weight:900}
.reader-summary-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:18px;align-items:start}.reader-summary-layout>.reader-card{margin:18px 0}.forge-material-groups{display:grid;gap:12px}.forge-material-group{padding:10px;border:1px solid #283646;border-radius:12px;background:#0a1017}.forge-material-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px}.forge-material-row+.forge-material-row{border-top:1px solid #202b37}.forge-material-icon{width:40px;height:40px;object-fit:contain;border:1px solid #2d3b49;border-radius:8px;background:#070b10}.forge-material-name{min-width:0}.forge-material-name strong{display:block;color:#f2f5f8;line-height:1.35}.forge-material-name .en{font-size:12px;color:#8496aa;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.forge-material-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.forge-material-tag{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:999px;border:1px solid #6d5a2b;background:#2a2112;color:#ffd876;font-size:11px;font-weight:900;white-space:nowrap}.forge-material-qty{min-width:46px;text-align:right;color:#ffd56d;font-size:15px;font-weight:900;white-space:nowrap}.forge-material-qty.zero{color:#66788d}.forge-material-note{margin:0 0 12px;color:#8697aa;font-size:13px;line-height:1.6}
.ok{color:#7ee09b}.bad{color:#ff8080}.muted2{color:#8697aa;font-size:13px;line-height:1.6}.hidden{display:none!important}
@media(max-width:980px){.reader-summary-layout{grid-template-columns:1fr}}
@media(max-width:800px){.reader-grid{grid-template-columns:1fr 1fr}.slot-grid{grid-template-columns:1fr}}
@media(max-width:520px){.reader-grid{grid-template-columns:1fr}.forge-material-row{grid-template-columns:38px minmax(0,1fr)}.forge-material-icon{width:36px;height:36px}.forge-material-meta{grid-column:2;justify-content:flex-start}.forge-material-qty{text-align:left}}
</style></head><body>
<header class="top"><nav class="nav"><a class="brand" href="../index.html" aria-label="新暮光之晨 首頁"><img class="brand-logo" src="../images/site-icon.png" alt="新暮光之晨 icon"><span class="brand-title"><span class="brand-name">新暮光之晨</span><span class="brand-version">v2.74</span></span></a><a href="../index.html">🏠 首頁</a><a href="鍛造.html">🔨 鍛造</a><a href="副本材料.html">🏰 副本材料&裝備</a><a href="攻略首頁.html">🎬 副本攻略</a><a href="材料.html">🧱 鍛造材料&合成商人</a><a href="裝備.html">📘 裝備資料庫</a><a href="NPC.html">📍 NPC位置</a><a href="職業.html">✨ 職業技能</a><a href="搜尋.html">🛡️ 配裝</a><a href="掉落率.html">🎲 掉落率</a><a class="active" href="存檔讀取.html">📂 存檔讀取</a></nav></header>
<main class="wrap reader-wrap"><h1>📂 Twilight's Eve New 存檔讀取</h1>
<div class="reader-upload"><button id="pickFolder" class="reader-btn primary" type="button">📁 選擇／更換存檔資料夾</button><button id="refreshFolder" class="reader-btn secondary" type="button" disabled>🔄 刷新</button><input id="folder" class="folder-picker" type="file" accept=".txt,text/plain" webkitdirectory directory multiple><button id="demo" class="reader-btn" type="button">清除結果</button></div>
<div class="reader-hints" aria-label="存檔讀取提示"><span class="reader-hint">ℹ️ <strong>僅顯示配裝頁已收錄的最終職業角色</strong>，前期轉職角色不列入。</span><span class="reader-hint">🛒 部分前期商店購買裝備可能沒有圖片，屬正常情況。</span></div>
<div id="savePickerWrap" class="save-picker-wrap hidden"><label for="savePicker">切換最終職業角色：</label><select id="savePicker"></select><span id="scanSummary" class="scan-summary"></span></div>
<div id="status" class="reader-card">請選擇存檔資料夾。</div>
<section id="result" class="hidden">
  <div class="reader-card"><h2>角色資料</h2><div id="stats" class="reader-grid"></div></div>
  <div class="reader-card"><h2>身上裝備</h2><div id="inventory" class="slot-grid"></div></div>
  <div class="reader-card"><h2>倉庫</h2><div id="tabs" class="stash-tabs"></div><div id="stash" class="slot-grid"></div></div>
  <div class="reader-summary-layout">
    <div class="reader-card"><h2>身上＋倉庫持有總數</h2><p class="muted2">把身上裝備與 6 個倉庫合併統計。</p><table class="summary-table"><tbody id="ownedSummary"></tbody></table></div>
    <aside class="reader-card"><h2>🔨 鍛造素材</h2><p class="forge-material-note">數量使用「身上＋所有倉庫」合計；未持有也會顯示 × 0。</p><div id="forgeMaterials" class="forge-material-groups"></div></aside>
  </div>
</section></main>
<footer class="site-footer"><div><strong>新暮光之晨</strong>　v2.74</div></footer>
<script src="../loadout-rules.js"></script><script src="../save-reader.js"></script><script>
const folder=document.getElementById('folder'),pickFolder=document.getElementById('pickFolder'),refreshFolder=document.getElementById('refreshFolder'),savePickerWrap=document.getElementById('savePickerWrap'),savePicker=document.getElementById('savePicker'),scanSummary=document.getElementById('scanSummary'),status=document.getElementById('status'),result=document.getElementById('result'),stats=document.getElementById('stats'),inv=document.getElementById('inventory'),tabs=document.getElementById('tabs'),stash=document.getElementById('stash'),ownedSummary=document.getElementById('ownedSummary'),forgeMaterials=document.getElementById('forgeMaterials');
let parsed=null,activeStash=0,scannedSaves=[],currentDirectoryHandle=null;
const FINAL_JOB_NAMES=new Set((typeof LOADOUT_ROLE_ORDER!=='undefined'?LOADOUT_ROLE_ORDER:[]).filter(name=>LOADOUT_ROLE_RULES?.[name]?.status==='已實裝').map(x=>String(x).trim()));
const FINAL_JOB_EN_NAMES=new Set([...FINAL_JOB_NAMES].map(name=>String(LOADOUT_ROLE_RULES?.[name]?.en||'').trim().toLowerCase()).filter(Boolean));
const HANDLE_DB='twilight-save-reader',HANDLE_STORE='handles',HANDLE_KEY='save-folder';
function isFinalJob(job){const j=String(job||'').trim();return FINAL_JOB_NAMES.has(j)||FINAL_JOB_EN_NAMES.has(j.toLowerCase());}
function labelItem(x){return x.cn||`物品 #${x.index}`;}
function imgPath(x){if(!x.image)return '';return x.image.startsWith('../')?x.image:'../'+x.image.replace(/^\.\//,'');}
function itemCard(x,i){const img=imgPath(x);return `<div class="slot">${img?`<img class="item-icon" src="${img}" alt="${labelItem(x)}" onerror="this.style.visibility='hidden'">`:'<div class="item-icon"></div>'}<div class="slot-body"><div class="n">${i+1}. ${labelItem(x)}</div><div class="en">${x.en||''}</div><div class="qty">數量 × ${x.charges}</div></div></div>`;}
function renderStash(){tabs.innerHTML=parsed.data.stashes.map((s,i)=>`<button class="${i===activeStash?'active':''}" data-i="${i}">倉庫 ${i+1}（${s.length}/6）</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeStash=Number(b.dataset.i);renderStash()});const s=parsed.data.stashes[activeStash];stash.innerHTML=s.length?s.map(itemCard).join(''):'<div class="muted2">這個倉庫沒有物品。</div>';}
function renderOwnedSummary(){const map=new Map();[...parsed.data.inventory,...parsed.data.stashes.flat()].forEach(x=>{const key=x.index+'|'+x.rawcode;const prev=map.get(key)||{qty:0,sample:x};prev.qty+=x.charges;map.set(key,prev);});ownedSummary.innerHTML=[...map.values()].sort((a,b)=>b.qty-a.qty).map(({sample,qty})=>`<tr><td><strong>${sample.cn||`物品 #${sample.index}`}</strong><div class="muted2">${sample.en||''}</div></td><td>× ${qty}</td></tr>`).join('')||'<tr><td>沒有物品</td><td></td></tr>';}
const FORGE_MATERIAL_GROUPS=[[{index:75,tag:'lv.100'},{index:84,tag:'lv.125'}],[{index:92,tag:'h1~4'},{index:100,tag:'h1~4'},{index:134,tag:'h1~4'},{index:142,tag:'h1~4'}],[{index:170,tag:'imp1~3'},{index:171,tag:'imp1~3'},{index:192,tag:'imp1~3'},{index:193,tag:'imp1~3'},{index:194,tag:'imp1~3'},{index:252,tag:'imp1~3'},{index:253,tag:'imp1~3'}],[{index:320,tag:'M1'},{index:319,tag:'M1'},{index:321,tag:'M1'}]];
function ownedQuantityMap(){const map=new Map();[...parsed.data.inventory,...parsed.data.stashes.flat()].forEach(x=>{map.set(Number(x.index),(map.get(Number(x.index))||0)+Number(x.charges||0))});return map;}
function renderForgeMaterials(){const qtyMap=ownedQuantityMap();forgeMaterials.innerHTML=FORGE_MATERIAL_GROUPS.map(group=>`<div class="forge-material-group">${group.map(({index,tag})=>{const meta=SAVE_READER_ITEM_META[index]||{index,cn:`物品 #${index}`,en:'',image:''};const qty=qtyMap.get(index)||0;const img=imgPath(meta);return `<div class="forge-material-row">${img?`<img class="forge-material-icon" src="${img}" alt="${meta.cn||''}" onerror="this.style.visibility='hidden'">`:'<div class="forge-material-icon"></div>'}<div class="forge-material-name"><strong>${meta.cn||`物品 #${index}`}</strong><div class="en">${meta.en||''}</div></div><div class="forge-material-meta"><span class="forge-material-tag">${tag}</span><span class="forge-material-qty ${qty===0?'zero':''}">× ${qty}</span></div></div>`;}).join('')}</div>`).join('');}
function render(){const d=parsed.data,m=parsed.meta;status.innerHTML=parsed.verified?'<strong class="ok">✓ 存檔讀取完成</strong>':'<strong class="bad">⚠ 存檔格式可能不完整</strong>';stats.innerHTML=`<div class="stat"><b>ID</b><strong>${m.id||'—'}</strong></div><div class="stat"><b>職業</b><strong>${m.job||'—'}</strong></div><div class="stat"><b>等級</b><strong>${m.level||'—'}</strong></div><div class="stat"><b>金幣</b><strong>${d.gold.toLocaleString()}</strong></div><div class="stat"><b>木材 / Power Shard</b><strong>${d.lumber.toLocaleString()}</strong></div>`;inv.innerHTML=d.inventory.length?d.inventory.map(itemCard).join(''):'<div class="muted2">沒有身上裝備。</div>';renderStash();renderOwnedSummary();renderForgeMaterials();result.classList.remove('hidden');}
function normalizeRecord(x){if(x&&x.file)return x;return {file:x,path:String(x?.webkitRelativePath||x?.name||'')};}
function isBackupFile(record){const r=normalizeRecord(record),f=r.file;const path=String(r.path||f?.webkitRelativePath||f?.name||'').replace(/\\/g,'/');const parts=path.split('/').filter(Boolean);const inBackup=parts.some((x,i)=>i<parts.length-1&&/^backup$/i.test(x));return inBackup||/^\d+\.txt$/i.test(f?.name||'');}
function saveDisplayName(entry){const m=entry.parsed.meta||{},job=m.job||'未知職業',level=Number(m.level||0);return `${job} Lv.${level} ｜ ${m.id||'未知 ID'}`;}
function currentSaveKey(){const i=Number(savePicker.value);return Number.isFinite(i)&&scannedSaves[i]?scannedSaves[i].key:'';}
function useScannedSave(index){const entry=scannedSaves[index];if(!entry)return;parsed=entry.parsed;activeStash=0;render();savePicker.value=String(index);}
async function scanFolderFiles(fileList,options={}){const records=[...fileList].map(normalizeRecord);const txt=records.filter(r=>/\.txt$/i.test(r.file?.name||'')&&!isBackupFile(r));if(!txt.length){status.innerHTML='<strong class="bad">找不到可用的存檔。</strong>';result.classList.add('hidden');savePickerWrap.classList.add('hidden');scanSummary.textContent='';return;}status.textContent='正在更新存檔…';const finalJobs=[];for(const r of txt){try{const p=TwilightSaveReader.decodeText(await r.file.text());if(isFinalJob(p.meta?.job)){const key=r.path||`${p.meta?.id||''}|${p.meta?.job||''}|${r.file.name}`;finalJobs.push({file:r.file,path:r.path,key,parsed:p});}}catch(e){}}
if(!finalJobs.length){scannedSaves=[];savePicker.innerHTML='';savePickerWrap.classList.add('hidden');status.innerHTML='<strong class="bad">找不到配裝頁中的最終職業角色。</strong>';result.classList.add('hidden');return;}
finalJobs.sort((a,b)=>Number(b.parsed.meta.level||0)-Number(a.parsed.meta.level||0)||(b.file.lastModified||0)-(a.file.lastModified||0)||a.file.name.localeCompare(b.file.name,'zh-Hant'));scannedSaves=finalJobs;savePicker.innerHTML=finalJobs.map((x,i)=>`<option value="${i}">${saveDisplayName(x)}</option>`).join('');scanSummary.textContent=`找到 ${finalJobs.length} 隻最終職業角色`;savePickerWrap.classList.remove('hidden');const preferred=String(options.preferredKey||'');const keepIndex=preferred?finalJobs.findIndex(x=>x.key===preferred):-1;useScannedSave(keepIndex>=0?keepIndex:0);}
function openHandleDB(){return new Promise((resolve,reject)=>{try{const req=indexedDB.open(HANDLE_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(HANDLE_STORE))db.createObjectStore(HANDLE_STORE);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);}catch(e){reject(e);}});}
async function saveHandle(handle){try{const db=await openHandleDB();await new Promise((resolve,reject)=>{const tx=db.transaction(HANDLE_STORE,'readwrite');tx.objectStore(HANDLE_STORE).put(handle,HANDLE_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();}catch(e){}}
async function loadHandle(){try{const db=await openHandleDB();const value=await new Promise((resolve,reject)=>{const tx=db.transaction(HANDLE_STORE,'readonly');const req=tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});db.close();return value;}catch(e){return null;}}
async function collectDirectoryFiles(handle,prefix=''){const out=[];for await(const [name,child] of handle.entries()){const path=prefix?`${prefix}/${name}`:name;if(child.kind==='directory'){if(/^backup$/i.test(name))continue;out.push(...await collectDirectoryFiles(child,path));}else if(child.kind==='file'&&/\.txt$/i.test(name)){try{out.push({file:await child.getFile(),path});}catch(e){}}}return out;}
async function hasReadPermission(handle,ask=false){if(!handle)return false;try{let p=await handle.queryPermission({mode:'read'});if(p==='granted')return true;if(ask)p=await handle.requestPermission({mode:'read'});return p==='granted';}catch(e){return false;}}
function setRememberedHandle(handle){currentDirectoryHandle=handle||null;refreshFolder.disabled=!currentDirectoryHandle;}
async function scanDirectoryHandle(handle,options={}){if(!handle)return;status.textContent='正在讀取存檔資料夾…';const files=await collectDirectoryFiles(handle);await scanFolderFiles(files,options);}
async function findChildDirectory(handle,name){if(!handle||handle.kind!=='directory')return null;try{for await(const [childName,child] of handle.entries()){if(child.kind==='directory'&&childName.toLowerCase()===String(name).toLowerCase())return child;}}catch(e){}return null;}
async function resolveExpectedSaveFolder(handle){if(!handle||handle.kind!=='directory')return null;const target="Twilight's Eve New ORPG";if(String(handle.name||'').toLowerCase()===target.toLowerCase())return handle;let direct=await findChildDirectory(handle,target);if(direct)return direct;let custom=null;const name=String(handle.name||'').toLowerCase();if(name==='custommapdata')custom=handle;else custom=await findChildDirectory(handle,'CustomMapData');if(custom){const found=await findChildDirectory(custom,target);if(found)return found;}let warcraft=null;if(name==='warcraft iii')warcraft=handle;else warcraft=await findChildDirectory(handle,'Warcraft III');if(warcraft){const cm=await findChildDirectory(warcraft,'CustomMapData');if(cm){const found=await findChildDirectory(cm,target);if(found)return found;}}const docs=await findChildDirectory(handle,'Documents');if(docs){const wc=await findChildDirectory(docs,'Warcraft III');if(wc){const cm=await findChildDirectory(wc,'CustomMapData');if(cm){const found=await findChildDirectory(cm,target);if(found)return found;}}}return null;}
async function openDirectoryPickerAt(startIn){const opts={id:'twilight-save-folder',mode:'read'};if(startIn)opts.startIn=startIn;try{return await window.showDirectoryPicker(opts);}catch(e){if(e?.name==='AbortError')throw e;if(startIn){return await window.showDirectoryPicker({id:'twilight-save-folder',mode:'read'});}throw e;}}
async function chooseFolder(){if('showDirectoryPicker' in window){try{let remembered=currentDirectoryHandle||await loadHandle();const startIn=remembered||'documents';const picked=await openDirectoryPickerAt(startIn);const resolved=await resolveExpectedSaveFolder(picked);const handle=resolved||picked;setRememberedHandle(handle);await saveHandle(handle);if(resolved&&resolved!==picked)status.textContent=`已自動定位到「${handle.name||"Twilight's Eve New ORPG"}」，正在讀取…`;await scanDirectoryHandle(handle,{preferredKey:''});return;}catch(e){if(e?.name==='AbortError')return;}}
folder.click();}
async function refreshCurrent(){const preferredKey=currentSaveKey();let handle=currentDirectoryHandle;if(!handle){handle=await loadHandle();if(handle)setRememberedHandle(handle);}if(!handle){status.textContent='尚未記住存檔資料夾，請先選擇一次。';return;}if(!await hasReadPermission(handle,true)){status.textContent='需要重新授權存檔資料夾，請按「選擇／更換存檔資料夾」。';return;}await scanDirectoryHandle(handle,{preferredKey});}
pickFolder.onclick=chooseFolder;
refreshFolder.onclick=refreshCurrent;
folder.onchange=async()=>{if(!folder.files?.length)return;setRememberedHandle(null);await scanFolderFiles(folder.files,{preferredKey:''});};
savePicker.onchange=()=>useScannedSave(Number(savePicker.value));
document.getElementById('demo').onclick=()=>{folder.value='';parsed=null;scannedSaves=[];savePicker.innerHTML='';scanSummary.textContent='';savePickerWrap.classList.add('hidden');result.classList.add('hidden');status.textContent=currentDirectoryHandle?'已保留存檔資料夾，可按「刷新」重新讀取。':'請選擇存檔資料夾。';};
(async()=>{const handle=await loadHandle();if(!handle)return;setRememberedHandle(handle);if(await hasReadPermission(handle,false)){await scanDirectoryHandle(handle,{preferredKey:''});}else{status.textContent=`已記住存檔資料夾「${handle.name||''}」，按「刷新」即可更新。`;}})();
</script><script src="../mobile-nav.js"></script></body></html>
