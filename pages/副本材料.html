<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>副本材料&裝備｜新暮光之晨</title><link rel="icon" href="../images/site-icon.png">
<link rel="stylesheet" href="../style.css">
<style>
.group-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0 24px}.group-toolbar .search{flex:1;min-width:260px;margin:0}.group-toolbar select{width:210px;padding:13px 14px;background:#10151c;border:1px solid #303947;border-radius:10px;color:#fff}
.data-section{margin:0 0 34px;border:1px solid #29323e;border-radius:18px;overflow:hidden;background:#0f151d;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.data-section-title{padding:18px 22px;background:linear-gradient(90deg,#e6b6ac,#f1d0c8);color:#171717}.data-section-title h2{margin:0;font-size:25px;line-height:1.3}.data-section-title p{margin:5px 0 0;font-size:12px;opacity:.72}
.section-layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:0;align-items:stretch}.section-table{overflow:auto}.excel-head,.excel-row{display:grid;grid-template-columns:78px minmax(180px,1.25fr) minmax(140px,.9fr) minmax(300px,2fr);gap:14px;align-items:center}.excel-head{padding:11px 16px;background:#f5e4ad;color:#252525;font-weight:800;font-size:13px}.excel-row{padding:14px 16px;border-top:1px solid #252e3a;min-height:92px}.excel-row:hover{background:#141c26}.item-img{width:62px;height:62px;object-fit:contain;background:#080b0f;border:1px solid #2b3542;border-radius:9px;padding:3px}.item-name strong{display:block;font-size:16px;color:#f3f6fa}.item-name span{display:block;margin-top:4px;color:#8995a4;font-size:12px}.item-job,.item-effect{font-size:13px;line-height:1.55;white-space:normal;color:#d3dbe5}.side-panel{border-left:1px solid #29323e;background:#0b1016;padding:14px;display:flex;flex-direction:column;gap:10px}.side-panel-title{font-size:12px;font-weight:800;color:#aeb9c7;margin:2px 4px}.side-main{width:100%;max-height:460px;object-fit:contain;background:#080b0f;border-radius:10px;border:1px solid #29313c}.side-small{width:230px;height:230px;object-fit:contain;background:#080b0f;border-radius:10px;border:1px solid #29313c}.side-gallery{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.side-gallery img{max-width:100%;cursor:zoom-in}.side-note{font-size:11px;color:#778394;line-height:1.5}.material-table .excel-head,.material-table .excel-row{grid-template-columns:72px minmax(180px,1fr) minmax(180px,1.3fr)}.material-table .excel-row{min-height:74px}.cost{color:#d7dee7;font-size:13px;line-height:1.6;white-space:normal}.empty{padding:28px;text-align:center;color:#8e99a8}
@media(max-width:980px){.section-layout{grid-template-columns:1fr}.side-panel{border-left:0;border-top:1px solid #29323e}.side-main{max-height:520px}.excel-head{display:none}.excel-row{grid-template-columns:68px 1fr;gap:10px}.excel-row .item-job,.excel-row .item-effect,.excel-row .cost{grid-column:1/-1}.material-table .excel-row{grid-template-columns:68px 1fr}.item-img{width:58px;height:58px}}
</style>
</head><body><header class="top"><nav class="nav"><a class="brand" href="../index.html" aria-label="新暮光之晨 首頁"><img class="brand-logo" src="../images/site-icon.png" alt="新暮光之晨 icon"><span class="brand-title"><span class="brand-name">新暮光之晨</span><span class="brand-version">v2.74</span></span></a><a href="../index.html">🏠 首頁</a><a href="鍛造.html">🔨 鍛造</a><a href="副本材料.html">🏰 副本材料&裝備</a><a href="攻略首頁.html">🎬 副本攻略</a><a href="材料.html">🧱 鍛造材料&合成商人</a><a href="裝備.html">📘 裝備資料庫</a><a href="NPC.html">📍 NPC位置</a><a href="職業.html">✨ 職業技能</a><a href="搜尋.html">🛡️ 配裝</a></nav></header><main class="wrap"><h1>🏰 副本材料&裝備</h1><div class="group-toolbar"><input id="q" class="search" placeholder="搜尋副本、裝備、職業…"><select id="difficulty"><option value="">全部副本</option></select></div><div id="root"></div></main>
<footer class="site-footer"><div><strong>新暮光之晨</strong>　v2.74　｜　攻略資料庫・資料整合版</div><div>使用左上選單快速切換各頁功能</div></footer>
<script src="../app-data.js"></script><script>
Promise.resolve(loadDB()).then(d=>{ const L=EMBEDDED_LAYOUT;
 const root=document.getElementById('root'),q=document.getElementById('q'),sel=document.getElementById('difficulty');
 const groups=L.dungeon_groups; groups.forEach((g,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=g.title;sel.appendChild(o)});
 function render(){const qq=q.value.trim().toLowerCase(),pick=sel.value; let html='';
  groups.forEach((g,gi)=>{if(pick!==''&&pick!==String(gi))return; const list=d.loot.filter(x=>x.dungeon===g.title && (!qq || (g.title+(x.display_name||x.name)+(x.display_name_en||x.name_en)+x.job+x.effect).toLowerCase().includes(qq))); if(!list.length)return;
   html+=`<section class="data-section"><header class="data-section-title"><h2>${esc(g.title)}</h2><p>${list.length} 件掉落物</p></header><div class="section-layout"><div class="section-table"><div class="excel-head"><div>圖示</div><div>裝備名稱</div><div>適用職業</div><div>效果</div></div>`;
   html+=list.sort((a,b)=>(a.row||0)-(b.row||0)).map(x=>`<article class="excel-row">${x.image?`<img class="item-img" src="${esc(resolveImage(x))}" loading="lazy" alt="${esc(x.display_name||x.name)}">`:'<div></div>'}<div class="item-name"><strong style="color:${esc(x.name_color||'#f3f6fa')}">${esc(x.display_name||x.name)}</strong><span>${esc(x.display_name_en||x.name_en)}</span></div><div class="item-job">${formatText(x.job)}</div><div class="item-effect">${formatText(x.effect)}</div></article>`).join('');
   html+=`</div><aside class="side-panel"><div class="side-panel-title">📍 副本位置圖</div>${g.images.length?`<img class="side-main" src="${esc(g.images[0].file)}" loading="lazy" alt="${esc(g.title)} 位置圖">`:''}${g.images.length>1?`<div class="side-gallery"><img class="side-small" src="${esc(g.images[1].file)}" loading="lazy" alt="${esc(g.title)} 位置圖補充"></div>`:''}<div class="side-note">圖片沿用 Excel 原本放在該副本區塊旁邊的位置圖，不把圖片混進裝備清單。</div></aside></div></section>`;
  }); root.innerHTML=html||'<div class="empty">找不到符合的副本或裝備。</div>'; }
 q.oninput=render;sel.onchange=render;render();
}).catch(e=>document.getElementById('root').innerHTML='<div class="notice">資料載入失敗：'+esc(e.message)+'</div>');
</script><script src="../mobile-nav.js"></script>
</body></html>
